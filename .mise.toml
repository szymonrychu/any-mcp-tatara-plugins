[tools]
python = "3.12"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install every workspace member and the dev group into the venv"
run = "uv sync --all-packages"

[tasks.test]
description = "Run the repo tests and every plugin's tests"
run = "uv run pytest"

[tasks.lint]
description = "Lint and check formatting"
run = "uv run ruff check . && uv run ruff format --check ."

[tasks.fmt]
description = "Format and autofix"
run = "uv run ruff format . && uv run ruff check --fix ."
