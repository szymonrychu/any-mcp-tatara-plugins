# Virtual uv workspace root: not a package. Every <topic>/<plugin>/ directory is a member.

[tool.uv.workspace]
members = ["*/*"]
exclude = ["tests/*", ".*/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "*/*/tests"]
# Plugins may each hold a test module of the same name.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
