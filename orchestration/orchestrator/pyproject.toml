[project]
name = "any-mcp-tatara-orchestrator"
version = "0.1.0"
description = "any-mcp plugin: the agents-orchestrator agent API /agent/v1 as tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["any-mcp"]

[project.entry-points."any_mcp.plugins"]
orchestrator = "any_mcp_tatara_orchestrator:OrchestratorPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_mcp_tatara_orchestrator"]
